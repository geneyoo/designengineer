version: 1

rulepacks:
  docs-examples:
    check: make check
    latency: pre-commit
    escape: docs-ok
    rules:
      docs.yaml-parse:
        severity: error
        fix: Fix the YAML syntax in the example block.
        exemplar: docs/research/rulepacks.md
      docs.invalid-example:
        severity: error
        fix: Match the contracts in schema/config.schema.json and schema/workorder.schema.json.
        exemplar: schema/config.schema.json
      docs.unknown-example-shape:
        severity: error
        fix: Use config or work-order keys, or add a docs-ok escape above the block.
        exemplar: schema/config.schema.json
      docs.missing-exemplar:
        severity: error
        fix: Point rule exemplars at committed files in this repo.
        exemplar: docs/research/rulepacks.md
  no-sparkles:
    check: node tools/check-no-sparkles.mjs
    latency: pre-commit
    escape: sparkles-ok
    rules:
      asset.sparkles-icon:
        severity: error
        fix: Replace the sparkles / magic-wand AI-cliche icon with a purpose-specific glyph, or add a sparkles-ok escape.
        exemplar: docs/no-sparkles.md
